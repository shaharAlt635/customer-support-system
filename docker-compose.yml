# MongoDB for local development — a single-node replica set, which Prisma requires.
#
#   docker compose up -d                 # MongoDB only (run the app with `npm run dev`)
#   docker compose --profile app up -d   # MongoDB + Mailpit + the production app on :4000
#                                        # (read the emails it sends at http://localhost:8025)
#
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on first start, then reports health.
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Catches all outgoing email in the Docker setup; web inbox at http://localhost:8025.
  mailpit:
    profiles: ['app']
    image: axllent/mailpit:v1.21
    ports:
      - '8025:8025'
    restart: unless-stopped

  app:
    profiles: ['app']
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: mongodb://mongo:27017/support_desk?directConnection=true
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (32+ random characters)}
      CORS_ORIGIN: http://localhost:4000
      APP_URL: http://localhost:4000
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # Plain HTTP on localhost; set to true behind HTTPS.
      COOKIE_SECURE: 'false'
    volumes:
      - uploads:/app/apps/server/uploads
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
